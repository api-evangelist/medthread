name: MedThread
description: >-
  MedThread is an AI-powered Health Information Management (HIM) platform built
  specifically for long-term and post-acute care facilities — skilled nursing
  facilities (SNFs), nursing homes, assisted living facilities (ALFs), and
  rehabilitation centers. The platform digitizes paper records with AI-powered
  scanning, runs continuous automated audits for documentation completeness and
  regulatory compliance, monitors CMS quality metrics (rehospitalization,
  pressure ulcers, antipsychotic use), and provides a compliance dashboard,
  provider portal, and patient-facing Personal Health Record (PHR). MedThread
  advertises FHIR compatibility and pre-built EHR integrations (Epic, Cerner,
  Allscripts, eClinicalWorks, NextGen, Meditech, athenahealth, Greenway,
  Practice Fusion) via a secure API. Techstars-backed and based in Miami, FL. No
  public developer portal, API reference, or OpenAPI specification is published
  at this time.
